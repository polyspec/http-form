[package]
name = "http-forms-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "http_forms_node"
crate-type = ["cdylib"]

[dependencies]
http-forms = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
