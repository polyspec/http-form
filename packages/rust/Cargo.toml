[package]
name = "polyspec-http-form"
description = "Form value and multipart/form-data reading with one behavior for PHP, Python and Node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# BD-27 (a), binding design e6 BD-38 (5): `fs` holds the files of a request, their paths and the blocking I/O on them
# (F-10, F-11, F-17): `RequestBody`, the stored files and the moves of `UploadedFile`. Every target but WASM builds the
# default features; the generated WASM crate builds the core without them, as `core.features.wasm` of the contract
# states (binding GN-4a), so `rustix` and `tempfile`, which do not build for `wasm32-unknown-unknown`, are not built
# there (F-28).
default = ["fs"]
fs = ["dep:rustix", "dep:tempfile"]
# G-5: compiles the arming of the fault injection points (spec "Fault injection points"); for tests only. A binding
# crate turns it on through its own feature fault-test, and no release build has it.
fault-test = ["polyspec-binding-core/fault-test"]

[dependencies]
memchr = "2"
# The wait token `Io` of a function that does blocking I/O (binding design I-2 (4), spec F-17).
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.9" }
polyspec-http-media-type = { git = "https://github.com/polyspec/http-media-type.git", tag = "v0.0.5" }
rustix = { version = "1", default-features = false, features = ["fs", "std"], optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
# Only generated code makes a wait token; the tests make it through the feature `construct` (spec F-17). The tests arm
# the fault injection points of the contract cases through the feature `fault-test` (G-5).
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", tag = "v0.0.9", features = ["construct", "fault-test"] }
# The points are judged by the feature fault-test of this crate, which writes them (binding GN-5), so the tests turn it
# on.
polyspec-http-form = { path = ".", features = ["fault-test"] }
serde_json = "1"
