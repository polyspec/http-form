# One workspace: the core crate and the binding crates, the thin packages that binding scaffold writes (binding design
# L-2). One Cargo.lock at the root pins every dependency of all of them, the commit of polyspec-binding-core included.
[workspace]
resolver = "2"
members = ["packages/rust", "packages/ts", "packages/ts/wasm", "packages/python", "packages/php-ext", "packages/go/internal/ffi"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT"
rust-version = "1.99.0"

# R-1: a failure reaches its caller as an error with a kind (P-2), and no input becomes a plausible value (P-3). Every
# remaining use carries `#[allow(..., reason = "<rule id>")]`. The methods that turn an absence or a failure into a
# value are in clippy.toml. The lints hold for every crate of the workspace, the binding crates included, which take
# them with `[lints] workspace = true`; a binding crate allows unsafe code with a reason (binding B-4).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
map_err_ignore = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
disallowed_methods = "deny"
# H-22: every conversion of a number checks its range.
as_conversions = "deny"

# The release profile builds every package of a release, the Go static library among them, and Cargo sets lto for a
# whole profile and not for one package. LTO would put the standard library and binding_core into the one object of the
# Go static library, and a Go program that links it beside the static library of http-media-type would fail with
# duplicate symbols such as rust_eh_personality (binding GN-15i, CK-91). So no package takes LTO, and codegen-units = 1
# keeps the optimization across the units of each crate.
[profile.release]
lto = false
codegen-units = 1
