# One workspace: the core crate and the binding crates, the thin packages that binding scaffold writes (binding design
# L-2). One Cargo.lock at the root pins every dependency of all of them, the commit of polyspec-binding-core included.
[workspace]
resolver = "2"
members = ["packages/rust", "packages/ts", "packages/ts/wasm", "packages/python", "packages/php-ext", "packages/go/internal/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.99.0"

# R-1: a failure reaches its caller as an error with a kind (P-2), and no input becomes a plausible value (P-3). Every
# remaining use carries `#[allow(..., reason = "<rule id>")]`. The methods that turn an absence or a failure into a
# value are in clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
disallowed_methods = "deny"
# H-22: every conversion of a number checks its range.
as_conversions = "deny"

[profile.release]
lto = true
codegen-units = 1
